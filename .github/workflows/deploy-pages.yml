name: Deploy SlaintePages to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static Next.js export
        run: npm run build

      - name: Verify GitHub Pages static markers
        run: |
          test -f public-site/.nojekyll
          test -f public-site/CNAME
          test -f public-site/index.html
          test -f public-site/evals.html
          test -f public-site/agents.html
          test -f public-site/sitemap.xml
          test -f public-site/robots.txt
          test -f public-site/llms.txt
          test -f public-site/llms-full.txt
          test -f public-site/images/og/slainte-og.png
          python3 -c '
          import pathlib
          html = pathlib.Path("public-site/index.html").read_text()
          head_end = html.find("</head>")
          assert 0 < head_end < 8192, f"Expected </head> under 8192 bytes, got {head_end}"
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
